# 临时诊断工作流：只在需要排查 CI 测试环境时使用，排查结束后会删除。
name: 诊断测试环境（临时）

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diag.yml'

permissions:
  contents: read

jobs:
  diag:
    name: 诊断 vitest 配置与环境
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: ① 环境信息
        run: |
          set +e
          echo "== pwd =="; pwd
          echo "== node =="; node -v
          echo "== pnpm =="; pnpm -v
          echo "== CI = $CI =="
          echo "== ls -a =="; ls -a
          echo "== vitest.config.ts =="; cat vitest.config.ts

      - name: ② 用 Node 原生方式导入配置文件
        run: |
          set +e
          node -e "import('./vitest.config.ts').then(m=>console.log('IMPORT OK keys=',Object.keys(m),'test=',JSON.stringify(m.default && m.default.test)),e=>{console.log('IMPORT FAIL:',e && e.message)})"

      - name: ③ 基线：与 CI 完全相同的命令
        run: |
          set +e
          pnpm exec vitest run --configLoader native --reporter=verbose 2>&1 | head -25

      - name: ④ 插入一条探针用例，看测试里到底有没有 window
        run: |
          set +e
          cat > src/__diag.test.ts <<'EOF'
          import { test, expect } from 'vitest';
          test('diag: 测试运行时的全局环境', () => {
            console.log('DIAG typeof window = ' + typeof window);
            console.log('DIAG typeof document = ' + typeof document);
            console.log('DIAG typeof indexedDB = ' + typeof indexedDB);
            console.log('DIAG typeof HTMLElement = ' + typeof HTMLElement);
            console.log('DIAG expect === undefined? ' + String(typeof expect));
            expect(1).toBe(1);
          });
          EOF
          pnpm exec vitest run --configLoader native --reporter=verbose 2>&1 | grep -E "DIAG|__diag|Test Files|Tests " | head -30
          rm -f src/__diag.test.ts

      - name: ⑤ 显式指定配置文件
        run: |
          set +e
          pnpm exec vitest run --config vitest.config.ts --configLoader native --reporter=verbose 2>&1 | tail -12

      - name: ⑥ 换成 bundler 配置加载器（不带 --config）
        run: |
          set +e
          pnpm exec vitest run --reporter=verbose 2>&1 | tail -12

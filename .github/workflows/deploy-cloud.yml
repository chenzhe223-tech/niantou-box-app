# 念头盒 NianBox —— 部署云端同步后端（Cloudflare Worker + D1）。
#
# 只在需要时手动触发；也可以按需改成 push 触发。用到的 secret：
#   CLOUDFLARE_API_TOKEN   Workers Scripts:Edit + D1:Edit 权限的令牌
#   NIANBOX_IP_SALT        （可选）登录限流用的盐，重复部署传同一个值即可
#   AI_BASE_URL / AI_API_KEY / AI_MODEL                （可选）自动分类与隐私抽象
#   AI_FALLBACK_MODELS                                 （可选）主模型额度不足时依次退让的模型
#   AI_NOTE                                            （可选）免费额度 / 到期时间，显示在设置页
#   IMAGE_BASE_URL / IMAGE_API_KEY / IMAGE_MODEL       （可选）海报底图
#   IMAGE_FALLBACK_MODELS                              （可选）主图像模型不可用时退让的模型
#   MAIL_API_BASE / MAIL_API_KEY / MAIL_FROM           （可选）服务端发信
#   MAIL_PROVIDER / MAIL_FROM_NAME                     （可选）发信形状与显示名，留空自动判断
#   AI_PROVIDER_LABEL / IMAGE_PROVIDER_LABEL           （可选）界面上展示的「数据发给了谁」
#   NIANBOX_ADMIN_TOKEN                                （可选）运维令牌：运营看板用它签发一次性密码重置链接
#
# 任何 AI / 邮件密钥都只写进 Cloudflare Worker secret，绝不进前端产物、绝不进仓库。
# 一个都没配也能跑：接口会如实返回 configured:false，前端不会伪造成功。

name: 部署云端同步后端（Cloudflare）

on:
  push:
    branches: ["main"]
    paths:
      - "server/cloud-worker.js"
      - "server/cloud-schema.sql"
      - "server/deploy-cloud.mjs"
      - ".github/workflows/deploy-cloud.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: 部署云端后端
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 检查 Worker 语法
        run: node --check server/cloud-worker.js

      - name: 部署云端后端并自检
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          NIANBOX_IP_SALT: ${{ secrets.NIANBOX_IP_SALT }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          # 主模型额度不足时依次退让的备用模型（逗号分隔）。不填则只试主模型。
          AI_FALLBACK_MODELS: ${{ secrets.AI_FALLBACK_MODELS }}
          # 免费额度 / 到期时间这类运维注记：会原样回显到 /capabilities.aiNote 与设置页。
          AI_NOTE: ${{ secrets.AI_NOTE }}
          AI_PROVIDER_LABEL: ${{ secrets.AI_PROVIDER_LABEL }}
          IMAGE_BASE_URL: ${{ secrets.IMAGE_BASE_URL }}
          IMAGE_API_KEY: ${{ secrets.IMAGE_API_KEY }}
          IMAGE_MODEL: ${{ secrets.IMAGE_MODEL }}
          IMAGE_FALLBACK_MODELS: ${{ secrets.IMAGE_FALLBACK_MODELS }}
          IMAGE_PROVIDER_LABEL: ${{ secrets.IMAGE_PROVIDER_LABEL }}
          MAIL_API_BASE: ${{ secrets.MAIL_API_BASE }}
          MAIL_API_KEY: ${{ secrets.MAIL_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_PROVIDER: ${{ secrets.MAIL_PROVIDER }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
          # 运维令牌：只写进 Worker secret，用于 /admin/* 接口。留空则 /admin/* 返回 503。
          ADMIN_TOKEN: ${{ secrets.NIANBOX_ADMIN_TOKEN }}
          PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL || 'https://chenzhe223-tech.github.io/niantou-box-app/' }}
        run: node server/deploy-cloud.mjs --emit-result=cloud-result.json

      - name: 上传部署结果
        uses: actions/upload-artifact@v4
        with:
          name: cloud-deploy-result
          path: cloud-result.json
